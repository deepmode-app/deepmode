<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Deepmode – Sign up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --dw-bg: #050509;
        --dw-card: #111118;
        --dw-accent: #e50914;
        --dw-text: #f5f5f5;
        --dw-muted: #9ca3af;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #111118 0, #050509 45%, #020205 100%);
        color: var(--dw-text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
      }

      .shell {
        width: 100%;
        max-width: 360px;
        padding: 24px 16px;
      }

      .card {
        background: var(--dw-card);
        border-radius: 16px;
        padding: 20px 18px 16px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8);
      }

      .badge {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: var(--dw-muted);
        margin-bottom: 6px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 20px;
        letter-spacing: 0.04em;
      }

      .subtitle {
        font-size: 12px;
        color: var(--dw-muted);
        margin-bottom: 14px;
      }

      label {
        display: block;
        font-size: 11px;
        margin-top: 8px;
        margin-bottom: 2px;
        color: var(--dw-muted);
      }

      input {
        width: 100%;
        padding: 7px 8px;
        border-radius: 8px;
        border: 1px solid #27272f;
        background: #050509;
        color: var(--dw-text);
        font-size: 12px;
      }

      input:focus {
        outline: 1px solid var(--dw-accent);
      }

      button {
        width: 100%;
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 8px;
        border: none;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        background: var(--dw-accent);
        color: #ffffff;
      }

      button:hover {
        background: #f3121f;
      }

      button:disabled {
        background: #4b5563;
        cursor: default;
      }

      .error,
      .success {
        margin-top: 8px;
        font-size: 11px;
      }

      .error {
        color: #fecaca;
      }

      .success {
        color: #bbf7d0;
      }

      .foot {
        margin-top: 10px;
        font-size: 11px;
        color: var(--dw-muted);
        text-align: center;
      }

      .foot a {
        color: var(--dw-accent);
        text-decoration: none;
      }

      .foot a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="badge">Deepmode</div>
        <h1>Create your focus account</h1>
        <div class="subtitle">
          One email. Unlimited future deepwork. No feeds attached.
        </div>

        <form id="signupForm">
          <label for="email">Work email</label>
          <input id="email" type="email" required placeholder="you@company.com" />

          <label for="password">Password</label>
          <input id="password" type="password" minlength="8" required placeholder="At least 8 characters" />

          <label for="confirm">Confirm password</label>
          <input id="confirm" type="password" minlength="8" required placeholder="Repeat your password" />

          <button type="submit" id="submitBtn">Create account</button>
        </form>

        <div id="message" class="error" style="display:none;"></div>
        <div id="success" class="success" style="display:none;"></div>

        <div class="foot">
          Already have an account?
          <a href="/login">Log in</a>
        </div>
      </div>
    </div>

    <script>
      const signupForm = document.getElementById("signupForm");
      const submitBtn = document.getElementById("submitBtn");
      const msgDiv = document.getElementById("message");
      const okDiv = document.getElementById("success");

      function showError(text) {
        msgDiv.textContent = text;
        msgDiv.style.display = "block";
        okDiv.style.display = "none";
      }

      function showSuccess(text) {
        okDiv.textContent = text;
        okDiv.style.display = "block";
        msgDiv.style.display = "none";
      }

      signupForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        msgDiv.style.display = "none";
        okDiv.style.display = "none";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;

        if (!email || !password) {
          showError("Email and password are required.");
          return;
        }

        if (password !== confirm) {
          showError("Passwords don’t match.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating account...";

        try {
          // 1) Call /auth/register
          const res = await fetch("/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: email,
              password: password
            })
          });

          if (!res.ok) {
            let detail = "Couldn’t create your account. Try again.";
            try {
              const data = await res.json();
              if (data.detail) detail = data.detail;
            } catch (_) {}
            showError(detail);
            submitBtn.disabled = false;
            submitBtn.textContent = "Create account";
            return;
          }

          // Optional: show quick success while logging in
          showSuccess("Account created. Logging you in...");

          // 2) Auto-login: /auth/login
          const loginRes = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({
              grant_type: "password",
              username: email,
              password: password,
              scope: ""
            })
          });

          if (!loginRes.ok) {
            showSuccess("Account created. Redirecting to login...");
            window.location.href = "/login";
            return;
          }

          const loginData = await loginRes.json();
          if (loginData.access_token) {
            // Save JWT for later (dashboard, future extension auth, etc.)
            localStorage.setItem("deepmode_token", loginData.access_token);
            window.location.href = "/dashboard";
          } else {
            showSuccess("Account created. Redirecting to login...");
            window.location.href = "/login";
          }
        } catch (err) {
          console.error(err);
          showError("Network error. Try again in a minute.");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Create account";
        }
      });
    </script>
  </body>
</html>
