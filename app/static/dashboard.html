<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Deepwork AI – Dashboard</title>
    <style>
      :root {
        --dw-bg: #050509;
        --dw-card: #111118;
        --dw-accent: #e50914;
        --dw-text: #f5f5f5;
        --dw-muted: #9ca3af;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(circle at top, #111118 0, #050509 45%, #020205 100%);
        color: var(--dw-text);
      }

      .shell {
        max-width: 880px;
        margin: 0 auto;
      }

      .header {
        margin-bottom: 18px;
      }

      .badge {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: var(--dw-muted);
        margin-bottom: 4px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 0.03em;
      }

      .cards-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .card {
        background: var(--dw-card);
        border-radius: 14px;
        padding: 12px 14px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.75);
      }

      .card-title {
        font-size: 11px;
        color: var(--dw-muted);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        margin-bottom: 4px;
      }

      .card-value {
        font-size: 20px;
        font-weight: 600;
      }

      .card-sub {
        margin-top: 2px;
        font-size: 11px;
        color: var(--dw-muted);
      }

      .chip {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 999px;
        font-size: 10px;
        background: #1f2933;
        color: var(--dw-muted);
        margin-left: 6px;
      }

      .sessions-card h2 {
        font-size: 15px;
        margin: 0 0 8px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      th,
      td {
        padding: 6px 6px;
        border-bottom: 1px solid #1f2933;
      }

      th {
        text-align: left;
        color: var(--dw-muted);
        font-weight: 500;
        font-size: 11px;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      .pill {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 999px;
        font-size: 10px;
        background: #1f2933;
      }

      .pill-green {
        background: #166534;
        color: #dcfce7;
      }

      .pill-red {
        background: #7f1d1d;
        color: #fee2e2;
      }

      .muted {
        color: var(--dw-muted);
      }

      .empty {
        font-size: 12px;
        color: var(--dw-muted);
        padding: 4px 0 2px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="header">
        <div class="badge">Deepwork AI</div>
        <h1>Your Focus Stats</h1>
      </div>

      <div class="cards-row">
        <div class="card">
          <div class="card-title">Today</div>
          <div class="card-value" id="todayMinutes">0 min</div>
          <div class="card-sub">Deepwork completed today</div>
        </div>

        <div class="card">
          <div class="card-title">All Time</div>
          <div class="card-value" id="allTimeMinutes">0 min</div>
          <div class="card-sub">Minutes across all sessions</div>
        </div>

        <div class="card">
          <div class="card-title">
            Discipline Score
            <span class="chip" id="disciplineCounts">0 / 0</span>
          </div>
          <div class="card-value" id="disciplinePercent">0%</div>
          <div class="card-sub">Completed sessions / started</div>
        </div>
      </div>

      <div class="card sessions-card">
        <h2>Recent Sessions</h2>
        <div id="emptyState" class="empty" style="display:none;">
          No sessions yet. Start a Deepwork block from the Chrome extension.
        </div>
        <table id="sessionsTable" style="display:none;">
          <thead>
            <tr>
              <th>Date</th>
              <th>Task</th>
              <th>Category</th>
              <th>Planned</th>
              <th>Actual</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="sessionsBody"></tbody>
        </table>
      </div>
    </div>

    <script>
      const API_BASE_URL = window.location.origin;

      async function fetchSummary() {
        const res = await fetch(`${API_BASE_URL}/sessions/summary`);
        if (!res.ok) throw new Error("Failed to load summary");
        return await res.json();
      }

      async function fetchSessions() {
        const res = await fetch(`${API_BASE_URL}/sessions/`);
        if (!res.ok) throw new Error("Failed to load sessions");
        return await res.json();
      }

      function renderSummary(summary) {
        const todayEl = document.getElementById("todayMinutes");
        const allTimeEl = document.getElementById("allTimeMinutes");
        const disciplinePercentEl = document.getElementById("disciplinePercent");
        const disciplineCountsEl = document.getElementById("disciplineCounts");

        todayEl.textContent = `${summary.today_minutes} min`;
        allTimeEl.textContent = `${summary.all_time_minutes} min`;

        const pct =
          summary.total_sessions === 0
            ? 0
            : Math.round(
                (summary.completed_sessions / summary.total_sessions) * 100
              );

        disciplinePercentEl.textContent = `${pct}%`;
        disciplineCountsEl.textContent = `${summary.completed_sessions} / ${summary.total_sessions}`;
      }

      function renderSessions(sessions) {
        const tbody = document.getElementById("sessionsBody");
        const emptyState = document.getElementById("emptyState");
        const table = document.getElementById("sessionsTable");

        tbody.innerHTML = "";

        if (!sessions.length) {
          emptyState.style.display = "block";
          table.style.display = "none";
          return;
        }

        emptyState.style.display = "none";
        table.style.display = "table";

        sessions.forEach((s) => {
          const row = document.createElement("tr");

          const status =
            s.end_time === null
              ? { label: "Active / unfinished", color: "#b91c1c" }
              : { label: "Completed", color: "#16a34a" };

          const planned = `${s.planned_duration_minutes}m`;
          const actual =
            s.actual_duration_minutes === null ? "-" : `${s.actual_duration_minutes}m`;

          row.innerHTML = `
            <td>${new Date(s.start_time).toLocaleString()}</td>
            <td>${s.task}</td>
            <td><span class="pill">${s.category}</span></td>
            <td class="muted">${planned}</td>
            <td>${actual}</td>
            <td>
              <span style="
                display:inline-block;
                padding:2px 8px;
                border-radius:999px;
                font-size:11px;
                background:${status.color}22;
                color:${status.color};
              ">
                ${status.label}
              </span>
            </td>
          `;

          tbody.appendChild(row);
        });
      }

      async function loadDashboard() {
        try {
          const [summary, sessions] = await Promise.all([
            fetchSummary(),
            fetchSessions(),
          ]);

          renderSummary(summary);
          renderSessions(sessions);
        } catch (err) {
          console.error(err);
        }
      }

      document.addEventListener("DOMContentLoaded", loadDashboard);
    </script>
  </body>
</html>
