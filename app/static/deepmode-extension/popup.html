<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Deepmode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --dw-bg: #050509;
      --dw-card: #111118;
      --dw-accent: #e50914;
      --dw-text: #f9fafb;
      --dw-muted: #9ca3af;
      --dw-border: #27272f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 12px 14px 14px;
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: radial-gradient(circle at top, #171724 0, #050509 60%, #020205 100%);
      color: var(--dw-text);
    }

    h1 {
      font-size: 16px;
      margin: 0 0 6px;
    }

    .sub {
      font-size: 11px;
      color: var(--dw-muted);
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 11px;
      margin-bottom: 3px;
      color: var(--dw-muted);
    }

    input, select {
      width: 100%;
      padding: 6px 7px;
      border-radius: 8px;
      border: 1px solid #27272f;
      background: #050509;
      color: var(--dw-text);
      font-size: 12px;
      margin-bottom: 8px;
    }

    button {
      border-radius: 999px;
      border: none;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--dw-accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: #f3121f;
    }

    .btn-secondary {
      background: #18181f;
      color: var(--dw-text);
      border: 1px solid #27272f;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
    }

    .row button {
      flex: 1;
    }

    .error {
      font-size: 11px;
      color: #fecaca;
      margin-top: 4px;
      min-height: 14px;
    }

    .success {
      font-size: 11px;
      color: #bbf7d0;
      margin-top: 4px;
      min-height: 14px;
    }

    .meta {
      margin-top: 8px;
      font-size: 11px;
      color: var(--dw-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pill {
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      background: #111827;
      border: 1px solid #27272f;
    }

    .section {
      border-radius: 12px;
      border: 1px solid #27272f;
      background: #111118;
      padding: 10px 10px 8px;
      margin-bottom: 10px;
    }

    #loggedInSection { display: none; }
    #loginSection { display: none; }
  </style>
</head>
<body>
  <!-- LOGGED IN SECTION -->
  <div id="loggedInSection" class="section">
    <h1>Deepmode block</h1>
    <p class="sub" id="loggedInMeta"></p>

    <label for="taskInput">What are you working on?</label>
    <input id="taskInput" type="text" placeholder="Write spec, code feature, study…" />

    <label for="categorySelect">Category</label>
    <select id="categorySelect">
      <option value="coding">Coding</option>
      <option value="writing">Writing</option>
      <option value="study">Study</option>
      <option value="deepwork">Deep work</option>
    </select>

    <label for="durationSelect">Duration</label>
    <select id="durationSelect">
      <option value="25">25 minutes</option>
      <option value="50">50 minutes</option>
      <option value="90">90 minutes</option>
    </select>

    <div class="row">
      <button id="startBtn" class="btn-primary">Start focus block</button>
      <button id="stopBtn" class="btn-secondary" disabled>Stop</button>
    </div>

    <div id="statusMsg" class="success"></div>

    <div class="meta">
      <span id="sessionStatusText">No active block.</span>
      <button id="logoutBtn" class="btn-secondary" style="padding:4px 8px;font-size:10px;">
        Log out
      </button>
    </div>
  </div>

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="section">
    <h1>Sign in</h1>
    <p class="sub">Use the same email you used on deepmode.app.</p>

    <label for="emailInput">Email</label>
    <input id="emailInput" type="email" placeholder="you@example.com" />

    <label for="passwordInput">Password</label>
    <input id="passwordInput" type="password" />

    <div class="row">
      <button id="loginBtn" class="btn-primary">Log in</button>
    </div>

    <div id="loginError" class="error"></div>

    <div class="meta">
      <span>Need an account?</span>
      <span class="pill">Sign up on the website</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
